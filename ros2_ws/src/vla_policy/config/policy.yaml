policy_node:
  ros__parameters:
    backend: mock
    policy_path: lerobot/smolvla_base
    device: cuda
    task_instruction: "Move the object to the target area."
    control_hz: 5.0

    joint_state_topic: /joint_states
    arm_command_topic: /arm_controller/joint_trajectory
    gripper_command_topic: /gripper_controller/joint_trajectory

    joint_names:
      - joint1
      - joint2
      - gripper
    arm_joint_names:
      - joint1
      - joint2
    gripper_joint_names:
      - gripper

    camera_names:
      - top
      - side
      - wrist
    camera_topics:
      - /top_camera/image_raw
      - /side_camera/image_raw
      - /wrist_camera/image_raw
    # smolvla_base was trained with camera keys camera1/2/3.
    # Map our 3 cameras (top/side/wrist) to these keys in order.
    camera_keys:
      - observation.images.camera1
      - observation.images.camera2
      - observation.images.camera3

    state_key: observation.state
    task_key: task
    action_mode: delta_joint
    # scale=0.03 / max_delta=0.03: with SmolVLA positive bias (~+0.94/step),
    # joint2 traverses full range (-0.2→+1.3 = 1.5 rad) in ~9s at 5Hz.
    # Lower scale prevents instant saturation and gives gradual visible motion.
    action_scale: 0.03
    max_delta: 0.03
    command_duration_sec: 0.2
