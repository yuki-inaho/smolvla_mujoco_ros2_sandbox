mujoco_sim_node:
  ros__parameters:
    model_path: ""
    sim_hz: 200.0
    publish_hz: 10.0
    use_renderer: true
    image_width: 320
    image_height: 240
    joint_names:
      - joint1
      - joint2
      - gripper
    camera_names:
      - top
      - side
      - wrist
    camera_topics:
      - /top_camera/image_raw
      - /side_camera/image_raw
      - /wrist_camera/image_raw
    camera_info_topics:
      - /top_camera/camera_info
      - /side_camera/camera_info
      - /wrist_camera/camera_info
    joint_state_topic: /joint_states
    arm_command_topic: /arm_controller/joint_trajectory
    gripper_command_topic: /gripper_controller/joint_trajectory
    # Start at joint2 mid-range (0.5, midpoint of -0.3..1.3) so SmolVLA's
    # biased deltas traverse ~0.8 rad before saturation regardless of bias sign.
    # scale=0.03: negative bias(-0.3/step*0.03) → 17s to lower limit;
    #             positive bias(+0.94/step*0.03) → 6s to upper limit.
    # joint1 mid-range=0.0; joint2 mid-range=0.5
    initial_qpos:
      - 0.0
      - 0.5
      - 0.0
