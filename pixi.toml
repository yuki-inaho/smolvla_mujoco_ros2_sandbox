[workspace]
name = "pixi-ros2-mujoco-lerobot-smolvla"
version = "0.1.0"
description = "Ubuntu-first single-repo sandbox for ROS 2 + MuJoCo + LeRobot + SmolVLA"
authors = ["Your Team <robotics@example.com>"]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64"]

# focal-cu127: target host is Ubuntu 20.04 (Focal) + NVIDIA driver 565 (CUDA 12.7).
# Declaring the CUDA version lets the solver pick GPU-enabled builds and fails
# loudly if a package needs a newer toolkit than this driver supports.
[system-requirements]
cuda = "12.7"

[activation]
scripts = ["scripts/activate_ros_overlay.sh"]

[tasks]
doctor = { cmd = "python scripts/doctor.py" }
build = { cmd = "colcon build --symlink-install --event-handlers console_direct+", cwd = "ros2_ws" }
clean = { cmd = "rm -rf build install log", cwd = "ros2_ws" }
test = { cmd = "colcon test --event-handlers console_direct+ && colcon test-result --verbose", cwd = "ros2_ws", depends-on = ["build"] }
sim = { cmd = "ros2 launch vla_mujoco sim.launch.py", cwd = "ros2_ws", depends-on = ["build"] }
policy-mock = { cmd = "ros2 launch vla_policy policy.launch.py backend:=mock", cwd = "ros2_ws", depends-on = ["build"] }
policy-smolvla = { cmd = "ros2 launch vla_policy policy.launch.py backend:=smolvla", cwd = "ros2_ws", depends-on = ["build"] }
all-mock = { cmd = "bash scripts/launch_all.sh mock", depends-on = ["build"] }
all-smolvla = { cmd = "bash scripts/launch_all.sh smolvla", depends-on = ["build"] }
list-topics = { cmd = "ros2 topic list" }
echo-joints = { cmd = "ros2 topic echo /joint_states --once" }
record-bag = { cmd = "mkdir -p bags && ros2 bag record /joint_states /top_camera/image_raw /side_camera/image_raw /wrist_camera/image_raw /arm_controller/joint_trajectory /gripper_controller/joint_trajectory -o bags/session", cwd = "ros2_ws" }
train-smolvla = { cmd = "bash scripts/train_smolvla.sh" }

# focal-cu127: Python 3.12 is forced by the dependency chain:
#  - lerobot[smolvla] (PyPI 0.5.0/0.5.1) requires Python >=3.12
#  - RoboStack humble ships cp39/cp311/cp312 builds (no 3.10)
# The upstream setuptools<=58.2.0 pin breaks on 3.12 (stdlib distutils was removed
# and setuptools 58 does not vendor it). We use a 3.12-capable setuptools that still
# provides `setup.py develop` for `colcon build --symlink-install` (develop was
# removed in setuptools 80).
[dependencies]
python = ">=3.12,<3.13"
colcon-common-extensions = "*"
setuptools = ">=68,<80"

# ROS 2 Humble via RoboStack.
ros-humble-ros-base = "*"
ros-humble-rclpy = "*"
ros-humble-std-msgs = "*"
ros-humble-sensor-msgs = "*"
ros-humble-trajectory-msgs = "*"
ros-humble-cv-bridge = "*"
ros-humble-image-transport = "*"
ros-humble-camera-info-manager = "*"
ros-humble-rosbag2 = "*"
ros-humble-rosbag2-storage-default-plugins = "*"

# Optional but useful for a later ros2_control migration.
ros-humble-controller-manager = "*"
ros-humble-ros2-controllers = "*"
ros-humble-joint-state-broadcaster = "*"

# Pin packaging to a version compatible with lerobot (lerobot requires packaging<26.0).
# conda-forge has 26.2 by default which causes a PyPI solver conflict.
packaging = ">=24.2,<26.0"
# focal-cu127: lerobot>=0.5.0 requires numpy>=2.0.0,<2.3.0.
numpy = ">=2.0.0,<2.3.0"
opencv = "*"
ffmpeg = "*"
pyyaml = "*"
rich = "*"
pytest = "*"
ruff = "*"

[pypi-dependencies]
mujoco = ">=3.3.0,<4"
# Use lerobot 0.5.1: requires opencv-python-headless>=4.9.0,<4.14.0 (conda pins 4.13.0 OK),
# and packaging<26.0 (pinned in conda deps above).
lerobot = { version = ">=0.5.1,<0.6.0", extras = ["smolvla"] }
# lerobot requires torch>=2.7,<2.11 and torchvision>=0.22,<0.26.
# torch 2.10.0+cu128 (nightly/dev) removed torch._dynamo.utils.NP_SUPPORTED_MODULES
# which torchvision 0.25.0 depends on — pin torch to a stable 2.7.x build
# so the solver picks torchvision 0.22.x which is compatible.
torch = ">=2.7.0,<2.8.0"
torchvision = ">=0.22.0,<0.23.0"
